prompt = "User-authorised priority change (13 September 2026): Prompt 18 is paused with its existing hardening work preserved. Implement Prompt 19 now, including the linked Google Doc feedback and 12 screenshots recorded in docs/ui-feedback/prompt-19/september-13/README.md and the expanded Prompt 19 in docs/Prompt Series. After Prompt 19 implementation and focused verification, return to Prompt 18 for the final broad hardening/checking pass. Only stop permanently when both Prompt 19 and the resumed Prompt 18 are complete. This explicit order supersedes older numeric sequencing, recovery and stopping rules. Current/next prompt and per-prompt paused status in the ledger control recovery. Read-only authenticated Diary, Friends and Inbox verification was explicitly approved on 13 September 2026; preserve that authority along with earlier Tune Detail/reference approval. No production data mutations are authorised beyond the existing required migration exception.\n\nWork only in the Tunes repository for this project. This is an hourly implementation runner, not a planning task.\n\nTreat each scheduled occurrence as a fresh, self-contained coding run against the current repository state. Previous conversational context is non-authoritative: reconstruct continuity from the durable documents below, current code and targeted Git history, not assumptions or transcripts from earlier runs. Freshness applies between scheduled occurrences, not within an active implementation/debugging cycle. Continue autonomously through implementation, debugging and repeated test/fix cycles without routine approval, subject to the authority and safety boundaries below. An occurrence may take as long as necessary; the hourly schedule is not a one-hour execution limit. Prefer using wall-clock time freely when it reduces unnecessary model/context use.\n\nUse these durable project documents in this order:\n1. `docs/Prompt Runner State.md` — read first; it is the runner's only progress ledger.\n2. `docs/Tunes-App-Current-Context.md` — the durable description of current architecture/product state; read before changing code; update it when a completed prompt materially changes navigation, architecture, product language, mobile layout, design system or schema.\n3. `docs/Prompt Series` — locate the current numbered prompt from the state ledger and read only that exact prompt section unless evidence shows broader context is necessary.\n4. `docs/Tunes App — Full UI/UX Audit and 2026 Product Design Direction.md` — required on every run. Read its executive direction/experience model first, then the heading or headings directly relevant to the selected prompt. Do not read unrelated audit sections merely for completeness.\n5. Read `AGENTS.md` only if it exists in or above this repository.\n\nStart with only the files and sections needed for the selected prompt, while preserving the required reads above. Expand reconnaissance only when evidence requires it. Prefer targeted code search and deterministic tools (tests, type-checking, linting and builds) over repeated broad-context reasoning. Do not repeatedly reread unchanged files within a run, or load the complete Prompt Series, complete Git history or large unrelated repository areas unless necessary to resolve the current prompt. Follow existing implementations and repository conventions; avoid unrelated refactors, formatting churn, dependency changes and speculative improvements. Keep progress narration extremely limited.\n\nIf `docs/Prompt Runner State.md` does not exist, create it with this audited baseline: Prompt 1 complete; Prompt 2 complete; Prompt 6 has pre-existing partial uncommitted Tune Detail work and remains incomplete; next prompt is 3. Record the initial tracked-file fingerprint, excluding the runner state and temporary lock files.\n\nProgress-first recovery is required. Inspect the state file's current prompt status, last update time, recorded changed files and fingerprint before doing new work. If the state says `in progress` or `failed`, or a prior runner lock is stale, treat that as an interrupted run: resume and finish that same prompt before advancing. Resume the ledger's current prompt; honour the explicit user-authorised pause of Prompt 18 while Prompt 19 is current. A lock is stale only if it is older than two hours and there is no evidence of a current runner; record that recovery before replacing it.\n\nFingerprints are recovery evidence, not a reason to stall indefinitely. If repository changes differ from the recorded runner-owned fingerprint, inspect the diff, timestamps, prompt scope and run history. Adopt coherent current-prompt or earlier runner work as recovered runner-owned work, record the reconciliation and new fingerprint, set the prompt to `in progress`, and continue. If work is half-done, either finish it from its current state or rework that implementation from the code level where necessary to meet the prompt; do not block merely because files are dirty, fingerprints changed, or an implementation already exists. Existing uncommitted implementations may be revised when needed for correctness. Preserve unrelated user work where practical and resolve overlaps carefully. Only stop when a non-stale active lock exists, required authority or credentials are unavailable, usage is insufficient, or continuing would require an external/destructive action that is not authorized.\n\nBefore every run, acquire a small lock in `docs/.prompt-runner-lock` and release it before finishing. If a non-stale lock exists, do nothing. Do not use destructive Git commands, reset, stash, discard, or commit changes. GitHub/repository history is the fallback, but recovery and reimplementation must be performed through deliberate code edits rather than destructive cleanup.\n\nIf no prompt is stalled, run exactly one numbered prompt, beginning with Prompt 3. Implement the full selected prompt, preserve partial work for later prompts unless it must be revised for the current prompt, and do not mark a prompt complete merely because some related files already exist.\n\nSupabase migrations must stay aligned with the linked Supabase project. Whenever a prompt creates a migration, review it for minimality and reversibility, apply it to the linked Supabase project during the same run, then verify the remote migration/schema state. Do not leave a newly created migration local-only or mark the prompt complete until the remote apply and verification succeed. Creating and applying a migration that is required by the selected prompt is explicitly authorized and is the sole exception to the production-change restriction below. Do not create a migration when the implementation and index review show that none is needed.\n\nRun targeted tests during implementation. After implementation is stable, run the relevant tests plus `npm test`, `npx tsc --noEmit`, `npm run lint`, and `npm run build` where practical. Distinguish existing lint failures from new failures; do not claim a prompt complete if you introduced a failure. Perform real-browser or route verification when available. Prefer running expensive whole-project verification once at this post-implementation stage; repeat when failures or subsequent fixes require it, without weakening any required checks. Do not begin the next numbered prompt in the same run.\n\nUpdate `docs/Prompt Runner State.md` with current prompt number, status, changed files, checks/results, known baseline lint failures, manual verification still needed, the new tracked-file fingerprint, and the next prompt only after acceptance criteria are met. If the run must end before the prompt is finished, leave it in progress with its current runner-owned fingerprint and concrete continuation notes for the next run. After Prompt 19 passes focused acceptance, record Prompt 18 as next so broad hardening can resume on the implemented design. Do not stop after Prompt 19 alone. When the resumed Prompt 18 passes and both prompts are complete, record series completion and stop permanently.\n\nBefore finishing, persist all information genuinely needed by the next fresh run in the appropriate durable project document, subject to the existing stop/no-edit rules. Keep progress, recovery evidence, blockers and concrete continuation notes in `docs/Prompt Runner State.md`; update `docs/Tunes-App-Current-Context.md` only under the material-change conditions above. Do not rely on the final report or conversational history as the handoff. Keep the final report concise: prompt worked on, result, tests/checks, commit if applicable (the no-commit rule below still applies), blocker if applicable, and current next-prompt state.\n\nNever deploy the app, publish, send messages, change production data except for an explicitly required reviewed Supabase migration as described above, redeem usage-reset credits, use destructive Git commands, or create Git commits. Do not ask for or expose credentials. Usage availability is controlled by the scheduler; if this run cannot proceed because the service has insufficient usage, make no repository edits and allow the next scheduled run to retry."
